[project]
name = "conductor-backend"
version = "0.1.0"
description = "Conductor — LangGraph multi-agent orchestration backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "email-validator>=2.2.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.2",
    "redis>=5.0.7",
    "celery>=5.4.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "qdrant-client>=1.11.0",
    "openai>=1.40.0",
    "litellm>=1.44.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "structlog>=24.4.0",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "tiktoken>=0.7.0",
    "python-multipart>=0.0.9",
    "boto3>=1.35.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0.0", "onnxruntime>=1.19.0"]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]