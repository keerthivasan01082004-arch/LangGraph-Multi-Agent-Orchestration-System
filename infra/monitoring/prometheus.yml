global:
  scrape_interval: 15s

scrape_configs:
  - job_name: conductor-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["conductor-backend:8000"]

  - job_name: conductor-vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]