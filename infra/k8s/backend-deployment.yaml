apiVersion: apps/v1
kind: Deployment
metadata:
  name: conductor-backend
  labels:
    app: conductor
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: conductor
      tier: backend
  template:
    metadata:
      labels:
        app: conductor
        tier: backend
    spec:
      containers:
        - name: backend
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/conductor/backend:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: conductor-backend-secrets
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20