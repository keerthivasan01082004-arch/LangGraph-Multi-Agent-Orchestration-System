[project]
name = "conductor-finetune"
version = "0.1.0"
description = "Conductor — Mistral-7B LoRA/QLoRA fine-tuning pipeline"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "datasets>=2.21.0",
    "peft>=0.12.0",
    "bitsandbytes>=0.43.3",
    "trl>=0.9.6",
    "accelerate>=0.33.0",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.7.0",
    "vllm>=0.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]