# QLoRA config for Conductor fine-tune (see docs/09-fine-tuning.md)
base_model: HuggingFaceH4/zephyr-7b-beta
train_file: ./data/processed/train.jsonl
val_file: ./data/processed/val.jsonl
output_dir: ./out/lora
num_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2e-4
max_seq_len: 2048
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
quant_bits: 4
freeze_base: true
seed: 42
response_template: "### Assistant"
report_to:
  - wandb